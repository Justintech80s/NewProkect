name: Just Maker Rust DSP CI

on:
  push:
    paths:
      - "just-soundz-backend/rust-dsp/**"
      - "just-soundz-backend/app/services/rust_dsp.py"
      - ".github/workflows/just-maker-rust-dsp-ci.yml"
  pull_request:
    paths:
      - "just-soundz-backend/rust-dsp/**"
      - "just-soundz-backend/app/services/rust_dsp.py"
      - ".github/workflows/just-maker-rust-dsp-ci.yml"

permissions:
  contents: read

jobs:
  rust-dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: just-soundz-backend/rust-dsp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Rust DSP production extension
        run: cargo check --locked || cargo check

      - name: Run Rust DSP tests with Python linking
        env:
          PYO3_PYTHON: python
        run: cargo test --no-default-features --locked || cargo test --no-default-features
