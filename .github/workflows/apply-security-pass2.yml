name: Apply Security Pass 2

on:
  push:
    branches:
      - just-maker-security-auth-pass2
    paths:
      - ".github/workflows/apply-security-pass2.yml"
      - "just-soundz-backend/scripts/apply_security_pass2.py"
      - "just-soundz-backend/app/security.py"
      - "just-soundz-backend/app/ownership.py"
      - "just-soundz-backend/app/services/auth.py"
      - "just-soundz-backend/app/services/artifact_delivery.py"
      - "just-soundz-backend/tests/test_security_pass2.py"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: just-maker-security-auth-pass2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: just-soundz-backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply security integration
        working-directory: just-soundz-backend
        run: python scripts/apply_security_pass2.py
      - name: Compile backend
        working-directory: just-soundz-backend
        run: python -m compileall -q app tests
      - name: Run security regression suite
        working-directory: just-soundz-backend
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_security_pass2.py tests/test_api_smoke.py tests/test_jobs.py
      - name: Run full backend suite
        working-directory: just-soundz-backend
        env:
          PYTHONPATH: .
        run: pytest -q tests
      - name: Commit integrated security boundary
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add just-soundz-backend/app/main.py
          git commit -m "feat: integrate pass2 security ownership contracts"
          git push origin HEAD:just-maker-security-auth-pass2
