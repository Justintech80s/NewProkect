name: Just Maker Replicate Integration

on:
  push:
    paths:
      - "just-soundz-backend/gpu-worker/cog.yaml"
      - "just-soundz-backend/gpu-worker/predict.py"
      - "just-soundz-backend/app/services/providers.py"
      - "just-soundz-backend/app/services/model_registry.py"
      - "just-soundz-backend/app/services/router.py"
      - "just-soundz-backend/tests/test_replicate_gpu.py"
      - ".github/workflows/replicate-gpu-integration.yml"
  pull_request:
    paths:
      - "just-soundz-backend/gpu-worker/cog.yaml"
      - "just-soundz-backend/gpu-worker/predict.py"
      - "just-soundz-backend/app/services/providers.py"
      - "just-soundz-backend/app/services/model_registry.py"
      - "just-soundz-backend/app/services/router.py"
      - "just-soundz-backend/tests/test_replicate_gpu.py"
      - ".github/workflows/replicate-gpu-integration.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: just-soundz-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile integration
        run: python -m compileall -q app/services/providers.py app/services/model_registry.py app/services/router.py gpu-worker/predict.py tests/test_replicate_gpu.py
      - name: Run integration tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_replicate_gpu.py tests/test_gpu_pass5.py tests/test_pass6_specificity.py
      - name: Validate Cog manifest
        run: |
          test -f gpu-worker/cog.yaml
          grep -q 'gpu: true' gpu-worker/cog.yaml
          grep -q 'predict.py:Predictor' gpu-worker/cog.yaml
