name: Just Maker Backend CI

on:
  push:
    paths:
      - "just-soundz-backend/**"
      - ".github/workflows/just-maker-backend-ci.yml"
  pull_request:
    paths:
      - "just-soundz-backend/**"
      - ".github/workflows/just-maker-backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: just-maker-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: just-soundz-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: just-soundz-backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app tests

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: pytest -q tests

      - name: Run API smoke tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_api_smoke.py

      - name: Verify core hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/settings.py
            app/errors.py
            app/request_context.py
            app/services/job_states.py
          )
          if git grep -nE 'TODO|TBD|implement later' -- "${files[@]}"; then
            echo "Core hardening files contain unfinished placeholders."
            exit 1
          fi
          for symbol in AppSettings AppError JobStateError; do
            count=$(git grep -nE "class ${symbol}(\\(|:)" -- app | wc -l)
            test "$count" -eq 1 || {
              echo "Expected exactly one definition of ${symbol}; found ${count}."
              exit 1
            }
          done

  gpu-contract:
    name: GPU worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: just-soundz-backend/gpu-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight contract dependencies
        run: python -m pip install --upgrade pip && pip install fastapi pydantic numpy soundfile pytest

      - name: Compile GPU worker modules
        run: python -m compileall -q .

      - name: Test GPU conditioning contract
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_prompt_compiler.py tests/test_gpu_contract.py

  security-contract:
    name: Security contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        working-directory: just-soundz-backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fail on committed private secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(JUST_MAKER_SUPABASE_SERVICE_ROLE_KEY|JUST_MAKER_GPU_WORKER_TOKEN|JUST_SOUNDZ_PRIMARY_WORKER_TOKEN)=[A-Za-z0-9_./+=-]{20,}' -- ':!just-soundz-backend/.env.example'; then
            echo "A private Just Maker secret appears to be committed."
            exit 1
          fi

      - name: Verify artifact bucket remains documented as private
        shell: bash
        run: |
          set -euo pipefail
          grep -R "just-maker-artifacts" just-soundz-backend/schema >/dev/null

      - name: Run Pass 2 security regression tests
        working-directory: just-soundz-backend
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_security_pass2.py

      - name: Verify Pass 2 security hardening has no placeholders
        shell: bash
        run: |
          set -euo pipefail
          files=(
            just-soundz-backend/app/security.py
            just-soundz-backend/app/ownership.py
            just-soundz-backend/app/services/auth.py
            just-soundz-backend/app/services/artifact_delivery.py
          )
          if git grep -nE 'TODO|TBD|implement later' -- "${files[@]}"; then
            echo "Pass 2 security files contain unfinished placeholders."
            exit 1
          fi

  audio-contract:
    name: Audio DSP mastering stems contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: just-soundz-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile audio modules
        run: python -m compileall -q app/services tests/test_audio_pass3.py

      - name: Run Pass 3 audio regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_audio_pass3.py

      - name: Verify Pass 3 audio hardening has no placeholders
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/services/audio_safety.py
            app/services/rust_dsp.py
            app/services/mastering.py
            app/services/mastering_critic.py
            app/services/stem_mixer.py
          )
          if git grep -nE 'TODO|TBD|implement later' -- "${files[@]}"; then
            echo "Pass 3 audio files contain unfinished placeholders."
            exit 1
          fi

