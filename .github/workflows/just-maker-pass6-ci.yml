name: Just Maker Pass 6 Non-Generic Generation

on:
  push:
    paths:
      - "just-soundz-backend/app/services/producer.py"
      - "just-soundz-backend/app/services/conditioning.py"
      - "just-soundz-backend/app/services/instrumentation_planner.py"
      - "just-soundz-backend/gpu-worker/prompt_compiler.py"
      - "just-soundz-backend/tests/test_pass6_specificity.py"
      - "just-soundz-backend/gpu-worker/tests/test_pass6_specificity.py"
      - ".github/workflows/just-maker-pass6-ci.yml"
  pull_request:
    paths:
      - "just-soundz-backend/app/services/producer.py"
      - "just-soundz-backend/app/services/conditioning.py"
      - "just-soundz-backend/app/services/instrumentation_planner.py"
      - "just-soundz-backend/gpu-worker/prompt_compiler.py"
      - "just-soundz-backend/tests/test_pass6_specificity.py"
      - "just-soundz-backend/gpu-worker/tests/test_pass6_specificity.py"
      - ".github/workflows/just-maker-pass6-ci.yml"

permissions:
  contents: read

jobs:
  pass6-specificity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: just-soundz-backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Pass 6 modules
        working-directory: just-soundz-backend
        run: python -m compileall -q app/services/producer.py app/services/conditioning.py app/services/instrumentation_planner.py gpu-worker/prompt_compiler.py tests/test_pass6_specificity.py gpu-worker/tests/test_pass6_specificity.py
      - name: Run backend specificity tests
        working-directory: just-soundz-backend
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_pass6_specificity.py
      - name: Run GPU prompt specificity tests
        working-directory: just-soundz-backend/gpu-worker
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_pass6_specificity.py tests/test_prompt_compiler.py
      - name: Reject unfinished Pass 6 placeholders
        shell: bash
        run: |
          set -euo pipefail
          files=(
            just-soundz-backend/app/services/producer.py
            just-soundz-backend/app/services/conditioning.py
            just-soundz-backend/app/services/instrumentation_planner.py
            just-soundz-backend/gpu-worker/prompt_compiler.py
          )
          if git grep -nE 'TODO|TBD|implement later' -- "${files[@]}"; then
            echo "Pass 6 contains unfinished placeholders."
            exit 1
          fi
